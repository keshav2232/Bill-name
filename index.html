<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Invoice & Challan</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <nav class="sidebar no-print">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <h2>SmartBill</h2>
      </div>
      <ul class="nav-links">
        <li class="active" data-target="billing-view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          Create Document
        </li>
        <li data-target="products-view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          Manage Products
        </li>
      </ul>
      <div class="theme-toggle">
        <label class="switch">
          <input type="checkbox" id="darkModeToggle">
          <span class="slider round"></span>
        </label>
        <span>Dark Mode</span>
      </div>
    </nav>

    <main class="content">
      <!-- BILLING VIEW -->
      <section id="billing-view" class="view active">
        <div class="header no-print">
          <h1>Create <span id="doc-title">Bill</span></h1>
          <div class="doc-type-toggle">
            <label><input type="radio" name="docType" value="Bill" checked> Bill</label>
            <label><input type="radio" name="docType" value="Challan"> Challan</label>
          </div>
        </div>

        <div class="paper">
          <div class="print-header">
            <h2 id="print-header-title">BILL</h2>
          </div>
          
          <div class="customer-details">
            <div class="form-group">
              <label>Customer Name</label>
              <input type="text" id="customer-name" placeholder="John Doe">
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" id="customer-address" placeholder="123 Street Name">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="text" id="customer-phone" placeholder="+91 9876543210">
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="doc-date">
            </div>
          </div>

          <div class="add-item-panel no-print glass-panel">
            <h3>Add Item</h3>
            <div class="add-item-form">
              <div class="form-group search-container">
                <label>Product</label>
                <input type="text" id="product-search" placeholder="Search product..." autocomplete="off">
                <div id="search-dropdown" class="dropdown hidden"></div>
              </div>
              <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="item-price" min="0" step="0.01" placeholder="0.00">
              </div>
              <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="item-qty" min="1" value="1">
              </div>
              <button id="add-item-btn" class="primary-btn">Add</button>
            </div>
          </div>

          <table class="items-table">
            <thead>
              <tr>
                <th style="width: 5%">#</th>
                <th style="width: 50%">Product Name</th>
                <th style="width: 15%">Price</th>
                <th style="width: 10%">Qty</th>
                <th style="width: 15%">Total</th>
                <th style="width: 5%" class="no-print"></th>
              </tr>
            </thead>
            <tbody id="items-list">
              <!-- Items go here -->
            </tbody>
          </table>

          <div class="summary">
            <div class="summary-row grand-total">
              <span>Grand Total</span>
              <span id="grand-total">₹0.00</span>
            </div>
          </div>
        </div>

        <div class="action-buttons no-print">
          <button id="print-btn" class="primary-btn pulse">Save to Cloud & Print</button>
          <button id="clear-btn" class="secondary-btn">Clear Form</button>
        </div>
      </section>

      <!-- PRODUCTS VIEW -->
      <section id="products-view" class="view hidden no-print">
        <div class="header">
          <h1>Manage Products</h1>
          <p>Add new products to your local database</p>
        </div>

        <div class="glass-panel add-product-panel">
          <h3>Create New Product</h3>
          <form id="add-product-form">
            <div class="form-row">
              <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="new-prod-name" required placeholder="e.g. 6 INCH FLANGE">
              </div>
              <div class="form-group">
                <label>Category</label>
                <input type="text" id="new-prod-category" placeholder="e.g. Flange Categories">
              </div>
              <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="new-prod-price" required min="0" step="0.01" placeholder="0.00">
              </div>
            </div>
            <button type="submit" class="primary-btn">Save Product</button>
          </form>
        </div>

        <div class="products-list-panel">
          <h3>Your Custom Products</h3>
          <table class="custom-products-table">
            <thead>
              <tr>
                <th style="width: 40%">Name</th>
                <th style="width: 30%">Category</th>
                <th style="width: 15%">Price</th>
                <th style="width: 15%">Action</th>
              </tr>
            </thead>
            <tbody id="custom-products-list">
              <!-- Custom products go here -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
